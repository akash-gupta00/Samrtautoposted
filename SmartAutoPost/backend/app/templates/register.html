<!doctype html>
<html lang="en" data-theme="dark">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1">


<title>
Register · SmartAutoPost
</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/static/css/app.css?v=105">

<link rel="stylesheet" href="/static/css/register.css?v=11">


</head>


<body>


<div class="register-page">



    <!-- LEFT SECTION -->

    <div class="register-left">


        <div class="logo-box">
            SP
        </div>



        <h1>
            Plan smarter.
            <br>
            Publish faster.
        </h1>



        <p>
            One workspace for AI content,
            scheduling, analytics and every
            social channel.
        </p>



    </div>







    <!-- RIGHT SECTION -->


    <div class="register-right">


        <div class="register-box">



            <div class="register-brand">


                <div class="register-logo">
                    SP
                </div>


                <span>
                    Smart
                    <span style="color:#4f46e5;">
                        Auto
                    </span>
                    Post
                </span>


            </div>





            <h2>
                Create your account
            </h2>



            <p class="subtitle">
                Start managing your social media in minutes.
            </p>







            <form id="registerForm">



                <label>

                    Full name

                    <input

                        type="text"

                        id="name"

                        placeholder="Akash Kumar"

                        required

                    >

                </label>






                <label>

                    Email

                    <input

                        type="email"

                        id="email"

                        placeholder="you@example.com"

                        required

                    >

                </label>







                <label>

                    Password

                    <input

                        type="password"

                        id="password"

                        placeholder="Minimum 6 characters"

                        minlength="6"

                        required

                    >

                </label>







                <button

                    type="submit"

                    class="register-btn"

                >

                    Create account


                </button>





            </form>







            <p class="register-switch">


                Already registered?


                <a href="/login">

                    Sign in

                </a>


            </p>






        </div>


    </div>





</div>





<div id="toast" class="toast"></div>





<script src="/static/js/api.js"></script>

<script src="/static/js/auth.js"></script>



</body>


</html>
