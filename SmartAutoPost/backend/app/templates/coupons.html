{% extends "base.html" %}{% block content %}
<div class="page-hero"><div><p class="eyebrow">SmartAutoPost</p><h2>Coupons</h2><p>Create, validate and manage promotional discount codes.</p></div><button class="btn primary" type="button" onclick="openModal('couponModal')">+ New coupon</button></div>
<div class="card"><div class="card-title"><h2>Coupon Records</h2></div><div id="couponsTable" class="table-wrap"><div class="loading">Loading coupons…</div></div></div>
<div id="couponModal" class="modal"><div class="modal-card"><button class="close" type="button" onclick="closeModal('couponModal')">×</button><h2>Create coupon</h2><form id="couponForm"><label>Code<input id="couponCode" required minlength="3" placeholder="WELCOME20"></label><label>Description<input id="couponDescription" placeholder="Welcome discount"></label><div class="two-col"><label>Discount type<select id="couponType"><option value="percentage">Percentage</option><option value="fixed">Fixed</option></select></label><label>Discount value<input id="couponValue" type="number" min="0.01" step="0.01" required></label></div><div class="two-col"><label>Minimum amount<input id="couponMinimum" type="number" min="0" step="0.01" value="0"></label><label>Max discount<input id="couponMaximum" type="number" min="0.01" step="0.01"></label></div><div class="two-col"><label>Usage limit<input id="couponLimit" type="number" min="1" value="1"></label><label>Expires at<input id="couponExpiry" type="datetime-local"></label></div><button class="btn primary full" type="submit">Create coupon</button></form></div></div>
{% endblock %}
