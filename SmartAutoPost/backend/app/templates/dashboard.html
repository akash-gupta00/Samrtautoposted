{% extends "base.html" %}

{% block content %}
<div class="metric-grid">
  <div class="metric">
    <span>Total Posts</span>
    <b id="totalPosts">—</b>
    <small class="up">↗ Live data</small>
  </div>
  <div class="metric">
    <span>Scheduled</span>
    <b id="scheduledPosts">—</b>
    <small class="warning">Pending</small>
  </div>
  <div class="metric">
    <span>Published</span>
    <b id="publishedPosts">—</b>
    <small class="up">Active</small>
  </div>
  <div class="metric">
    <span>AI Generations</span>
    <b id="aiGenerations">—</b>
    <small>Generated content</small>
  </div>
</div>

<div class="dashboard-grid">
  <div class="card">
    <div class="card-title">
      <h2>Quick Analytics</h2>
    </div>
    <div class="analytics-list">
      <p><span>Total Posts</span><b id="qaPosts">—</b></p>
      <p><span>Scheduled</span><b id="qaScheduled">—</b></p>
      <p><span>Published</span><b id="qaPublished">—</b></p>
      <p><span>Connected Accounts</span><b id="qaAccounts">—</b></p>
    </div>
  </div>

  <div class="card wide">
    <div class="card-title">
      <h2>Recent Posts</h2>
      <a href="/posts">View all</a>
    </div>
    <div id="recentPosts" class="table-wrap"></div>
  </div>

  <div class="card">
    <div class="card-title">
      <h2>Connected Accounts</h2>
      <a href="/social-accounts">Manage</a>
    </div>
    <div id="dashboardAccounts" class="stack-list"></div>
  </div>
</div>
{% endblock %}
