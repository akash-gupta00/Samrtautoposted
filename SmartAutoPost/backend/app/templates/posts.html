{% extends "base.html" %}

{% block content %}
<div class="card" style="padding: 24px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div>
            <h2 style="margin: 0; font-size: 20px; font-weight: 700; color: #0f172a;">Posts</h2>
            <p style="margin: 4px 0 0 0; font-size: 13px; color: #64748b;">Manage, schedule, and view real-time publishing status across platforms.</p>
        </div>
        <a href="/create-post" class="btn primary" style="display: inline-flex; align-items: center; gap: 6px; text-decoration: none;">
            <span>+</span> Create Post
        </a>
    </div>

    <!-- Search & Filter Bar -->
    <div style="display: flex; gap: 12px; margin-bottom: 16px; align-items: center; flex-wrap: wrap;">
        <input type="text" id="postSearchInput" placeholder="Search posts..." 
               style="flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px;"
               oninput="filterPostsTable()">

        <div style="display: flex; gap: 6px;">
            <button type="button" class="btn small filter-btn active" data-filter="all" onclick="setPostStatusFilter('all', this)">All</button>
            <button type="button" class="btn small ghost filter-btn" data-filter="draft" onclick="setPostStatusFilter('draft', this)">Draft</button>
            <button type="button" class="btn small ghost filter-btn" data-filter="scheduled" onclick="setPostStatusFilter('scheduled', this)">Scheduled</button>
            <button type="button" class="btn small ghost filter-btn" data-filter="published" onclick="setPostStatusFilter('published', this)">Published</button>
            <button type="button" class="btn small ghost filter-btn" data-filter="failed" onclick="setPostStatusFilter('failed', this)">Failed</button>
        </div>
    </div>

    <!-- Posts Table -->
    <div style="overflow-x: auto; border: 1px solid #e2e8f0; border-radius: 8px;">
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 13px;">
            <thead>
                <tr style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; color: #475569; font-weight: 600;">
                    <th style="padding: 12px 16px; width: 45%;">TITLE / CONTENT</th>
                    <th style="padding: 12px 16px;">PLATFORM</th>
                    <th style="padding: 12px 16px;">STATUS</th>
                    <th style="padding: 12px 16px;">SCHEDULED</th>
                    <th style="padding: 12px 16px; text-align: right;">ACTIONS</th>
                </tr>
            </thead>
            <tbody id="postsTableBody">
                <tr>
                    <td colspan="5" style="padding: 24px; text-align: center; color: #64748b;">Loading posts...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
window.allLoadedPosts = [];
let currentFilter = 'all';

document.addEventListener('DOMContentLoaded', async () => {
    await loadPostsList();
});

async function loadPostsList() {
    const tbody = document.getElementById('postsTableBody');
    if (!tbody) return;

    let currentOrgId = typeof orgId === 'function' ? orgId() : Number(localStorage.getItem('organization_id') || 0);
    const token = localStorage.getItem('access_token') || localStorage.getItem('token') || '';
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

    let endpoint = currentOrgId ? `/api/v1/posts/?organization_id=${currentOrgId}` : '/api/v1/posts/';

    try {
        let res = await fetch(endpoint, { headers });
        if (!res.ok) {
            res = await fetch(currentOrgId ? `/posts/?organization_id=${currentOrgId}` : '/posts/', { headers });
        }

        const data = await res.json();
        window.allLoadedPosts = Array.isArray(data) ? data : (data.items || []);
        renderPostsTable();

    } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding: 24px; text-align: center; color: #ef4444;">Failed to load posts: ${err.message}</td></tr>`;
    }
}

function renderPostsTable() {
    const tbody = document.getElementById('postsTableBody');
    if (!tbody) return;

    const searchTerm = document.getElementById('postSearchInput')?.value.toLowerCase().trim() || '';

    let filtered = window.allLoadedPosts.filter(p => {
        const matchesStatus = (currentFilter === 'all') || (String(p.status).toLowerCase() === currentFilter);
        const matchesSearch = (p.title || '').toLowerCase().includes(searchTerm) || (p.caption || '').toLowerCase().includes(searchTerm);
        return matchesStatus && matchesSearch;
    });

    if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="padding: 32px; text-align: center; color: #64748b;">No posts found.</td></tr>`;
        return;
    }

    tbody.innerHTML = filtered.map(post => {
        const title = post.title || 'Untitled Post';
        const caption = post.caption || '';
        const platform = post.social_account_id || post.platform || 'General';
        const status = (post.status || 'draft').toLowerCase();
        
        let statusBadge = '';
        if (status === 'published') {
            statusBadge = '<span style="background: #dcfce7; color: #15803d; padding: 3px 8px; border-radius: 9999px; font-weight: 600; font-size: 11px;">published</span>';
        } else if (status === 'scheduled') {
            statusBadge = '<span style="background: #fef9c3; color: #854d0e; padding: 3px 8px; border-radius: 9999px; font-weight: 600; font-size: 11px;">scheduled</span>';
        } else if (status === 'failed') {
            statusBadge = '<span style="background: #fee2e2; color: #b91c1c; padding: 3px 8px; border-radius: 9999px; font-weight: 600; font-size: 11px;">failed</span>';
        } else {
            statusBadge = '<span style="background: #f1f5f9; color: #475569; padding: 3px 8px; border-radius: 9999px; font-weight: 600; font-size: 11px;">draft</span>';
        }

        const scheduledTime = post.scheduled_at ? new Date(post.scheduled_at).toLocaleString() : '—';

        let actionButtons = `
            <button class="btn small" style="background: #2563eb; color: #fff; border: none; font-size: 11px; padding: 4px 8px; cursor: pointer; border-radius: 4px;" onclick="publishPostDirectly(${post.id}, this)">Publish</button>
            <button class="btn small ghost" style="font-size: 11px; padding: 4px 8px; border: 1px solid #cbd5e1; cursor: pointer; border-radius: 4px;" onclick="editPostItem(${post.id})">Edit</button>
            <button class="btn small ghost" style="color: #ef4444; border: 1px solid #fca5a5; font-size: 11px; padding: 4px 8px; cursor: pointer; border-radius: 4px;" onclick="deletePostItem(${post.id})">Delete</button>
        `;

        if (status === 'published') {
            actionButtons = `
                <button class="btn small ghost" style="font-size: 11px; padding: 4px 8px; border: 1px solid #cbd5e1; cursor: pointer; border-radius: 4px;" onclick="editPostItem(${post.id})">Edit</button>
                <button class="btn small ghost" style="color: #ef4444; border: 1px solid #fca5a5; font-size: 11px; padding: 4px 8px; cursor: pointer; border-radius: 4px;" onclick="deletePostItem(${post.id})">Delete</button>
            `;
        }

        return `
            <tr style="border-bottom: 1px solid #f1f5f9;">
                <td style="padding: 12px 16px;">
                    <div style="font-weight: 600; color: #1e293b; margin-bottom: 2px;">${escapeHtml(title)}</div>
                    <div style="color: #64748b; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px;">${escapeHtml(caption)}</div>
                </td>
                <td style="padding: 12px 16px; color: #475569; font-weight: 500;">
                    ${platform}
                </td>
                <td style="padding: 12px 16px;">
                    ${statusBadge}
                </td>
                <td style="padding: 12px 16px; color: #64748b; font-size: 12px;">
                    ${scheduledTime}
                </td>
                <td style="padding: 12px 16px; text-align: right;">
                    <div style="display: inline-flex; gap: 6px; justify-content: flex-end;">
                        ${actionButtons}
                    </div>
                </td>
            </tr>
        `;
    }).join('');
}

// Direct Manual Publish Trigger
window.publishPostDirectly = async function(postId, btnEl) {
    if (!postId) return;
    
    const token = localStorage.getItem('access_token') || localStorage.getItem('token') || '';
    const headers = {
        'Content-Type': 'application/json',
        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
    };

    if (btnEl) {
        btnEl.disabled = true;
        btnEl.innerText = "Publishing... ⏳";
    }

    try {
        let res = await fetch(`/api/v1/posts/${postId}/publish`, {
            method: 'POST',
            headers: headers
        });

        if (res.status === 404) {
            res = await fetch(`/posts/${postId}/publish`, {
                method: 'POST',
                headers: headers
            });
        }

        const data = await res.json();
        
        if (!res.ok) {
            const errDetail = data.detail || data.message || JSON.stringify(data);
            alert("Google Business Publishing Error:\n" + errDetail);
            if (btnEl) {
                btnEl.disabled = false;
                btnEl.innerText = "Publish";
            }
            return;
        }

        alert("Post Successfully Published to Google Business! 🎉");
        await loadPostsList();

    } catch (err) {
        console.error("Publish error:", err);
        alert("Network/Server Error: " + err.message);
        if (btnEl) {
            btnEl.disabled = false;
            btnEl.innerText = "Publish";
        }
    }
};

window.deletePostItem = async function(postId) {
    if (!postId) return;
    if (!confirm('Are you sure you want to delete this post?')) return;

    const token = localStorage.getItem('access_token') || localStorage.getItem('token') || '';
    const headers = token ? { 'Authorization': `Bearer ${token}` } : {};

    try {
        let res = await fetch(`/api/v1/posts/${postId}`, {
            method: 'DELETE',
            headers: headers
        });

        if (res.status === 404) {
            res = await fetch(`/posts/${postId}`, {
                method: 'DELETE',
                headers: headers
            });
        }

        if (!res.ok) {
            const data = await res.json();
            throw new Error(data.detail || 'Delete failed');
        }

        alert('Post deleted successfully! 🗑️');
        window.allLoadedPosts = window.allLoadedPosts.filter(p => p.id !== postId);
        renderPostsTable();

    } catch (err) {
        alert(err.message || "Delete failed");
    }
};

window.editPostItem = function(postId) {
    location.href = `/create-post?edit_id=${postId}`;
};

window.setPostStatusFilter = function(status, btn) {
    currentFilter = status;
    document.querySelectorAll('.filter-btn').forEach(b => {
        b.classList.remove('active');
        b.classList.add('ghost');
    });
    btn.classList.add('active');
    btn.classList.remove('ghost');
    renderPostsTable();
};

window.filterPostsTable = function() {
    renderPostsTable();
};

function escapeHtml(text) {
    if (!text) return '';
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
</script>
{% endblock %}
