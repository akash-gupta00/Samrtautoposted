{% extends "base.html" %}{% block content %}
<div class="page-hero"><div><p class="eyebrow">SmartAutoPost</p><h2>Plans</h2><p>Create and manage subscription plans directly from the UI.</p></div><button class="btn primary" type="button" onclick="openModal('planModal')">+ New plan</button></div>
<div id="plansGrid" class="pricing-grid"><div class="loading">Loading plans…</div></div>
<div id="planModal" class="modal"><div class="modal-card"><button class="close" type="button" onclick="closeModal('planModal')">×</button><h2>Create plan</h2><form id="planForm"><label>Name<input id="planName" required placeholder="Pro"></label><div class="two-col"><label>Price<input id="planPrice" type="number" min="0" step="0.01" required></label><label>Billing cycle<select id="planCycle"><option value="monthly">Monthly</option><option value="yearly">Yearly</option></select></label></div><div class="two-col"><label>Social accounts<input id="planAccounts" type="number" min="1" value="5"></label><label>Posts/month<input id="planPosts" type="number" min="1" value="100"></label></div><div class="two-col"><label>AI generations<input id="planAi" type="number" min="1" value="100"></label><label>Team members<input id="planTeam" type="number" min="1" value="5"></label></div><label>Clients<input id="planClients" type="number" min="1" value="5"></label><button class="btn primary full" type="submit">Create plan</button></form></div></div>
{% endblock %}
