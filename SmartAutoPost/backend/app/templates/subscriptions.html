{% extends "base.html" %}{% block content %}
<div class="page-hero"><div><p class="eyebrow">SmartAutoPost</p><h2>Subscriptions</h2><p>Activate a plan, review history and cancel the current subscription.</p></div><div><button class="btn ghost" type="button" onclick="cancelSubscription()">Cancel current</button> <button class="btn primary" type="button" onclick="openModal('subscriptionModal')">Choose plan</button></div></div>
<div class="metric-grid compact"><div class="metric"><span>Current Plan ID</span><b id="currentPlan">—</b></div><div class="metric"><span>Status</span><b id="subscriptionStatus">—</b></div><div class="metric"><span>Ends</span><b id="subscriptionEnd">—</b></div></div><div class="card"><div class="card-title"><h2>Subscription Records</h2></div><div id="subscriptionTable" class="table-wrap"><div class="loading">Loading subscriptions…</div></div></div>
<div id="subscriptionModal" class="modal"><div class="modal-card"><button class="close" onclick="closeModal('subscriptionModal')">×</button><h2>Start subscription</h2><form id="subscriptionForm"><label>Plan<select id="subscriptionPlan" required></select></label><button class="btn primary full">Activate plan</button></form></div></div>
{% endblock %}
