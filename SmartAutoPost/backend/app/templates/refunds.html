{% extends "base.html" %}{% block content %}
<div class="page-hero"><div><p class="eyebrow">SmartAutoPost</p><h2>Refunds</h2><p>Create refund requests and track their status.</p></div><button class="btn primary" type="button" onclick="openModal('refundModal')">+ New refund</button></div>
<div class="card"><div class="card-title"><h2>Refund Records</h2></div><div id="refundsTable" class="table-wrap"><div class="loading">Loading refunds…</div></div></div>
<div id="refundModal" class="modal"><div class="modal-card"><button class="close" onclick="closeModal('refundModal')">×</button><h2>Create refund</h2><form id="refundForm"><label>Payment ID<input id="refundPayment" type="number" min="1" required></label><label>Amount<input id="refundAmount" type="number" min="0.01" step="0.01" required></label><label>Reason<textarea id="refundReason" rows="4"></textarea></label><button class="btn primary full">Create refund</button></form></div></div>
{% endblock %}
