{% extends "base.html" %}{% block content %}<div class="settings-grid"><div class="card"><h2>Appearance</h2><label>Theme<select id="themeSelect"><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Compact sidebar<input type="checkbox" id="compactSidebar"></label></div><div class="card"><h2>Publishing defaults</h2><label>Default platform<select><option>Instagram</option><option>Facebook</option><option>LinkedIn</option></select></label><label>Default timezone<input value="Asia/Kolkata"></label><button class="btn primary" onclick="showToast('Settings saved')">Save settings</button></div><div class="card danger-zone"><h2>Account security</h2><p>Manage sessions, password and two-factor authentication.</p><button class="btn ghost">Change password</button><button class="btn danger">Enable 2FA</button></div></div>{% endblock %}
