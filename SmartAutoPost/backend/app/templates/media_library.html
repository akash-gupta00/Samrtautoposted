{% extends "base.html" %}

{% block content %}
<div class="page-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <p class="muted" style="margin: 0;">Upload and reuse images or videos in your posts.</p>
    <label class="btn primary" style="cursor: pointer; padding: 9px 18px; border-radius: 8px; font-weight: 600;">
        + Upload Media
        <input id="mediaUpload" type="file" accept="image/*,video/*,application/pdf" hidden onchange="handleMediaUpload(event)">
    </label>
</div>

<div class="card" style="padding: 20px;">
    <div class="media-grid" id="mediaGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px;">
        <p style="color: #64748b;">Loading media library...</p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadMediaLibrary() {
    const grid = document.getElementById('mediaGrid');
    if (!orgId()) {
        grid.innerHTML = '<p class="muted">Please select or create an organization first.</p>';
        return;
    }

    try {
        const res = await api(`/media/list?organization_id=${orgId()}`);
        const items = Array.isArray(res) ? res : (res.items || []);

        if (items.length === 0) {
            grid.innerHTML = '<p class="muted">No media found. Upload your first media above.</p>';
            return;
        }

        grid.innerHTML = items.map(item => {
            let rawUrl = item.file_url || item.url || '';
            if (rawUrl && !rawUrl.startsWith('http') && !rawUrl.startsWith('/')) {
                rawUrl = '/' + rawUrl;
            }

            const fileType = item.file_type || item.media_type || '';
            const isVideo = fileType.startsWith('video') || (item.filename && item.filename.match(/\.(mp4|mov|webm)$/i));

            return `
                <div class="media-card" style="border: 1px solid #e2e8f0; border-radius: 10px; overflow: hidden; background: #fff; display: flex; flex-direction: column;">
                    <div style="height: 160px; background: #f8fafc; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">
                        ${isVideo ? `
                            <video src="${rawUrl}" controls style="width: 100%; height: 100%; object-fit: cover;"></video>
                        ` : `
                            <img src="${rawUrl}" alt="Media ${item.id}" 
                                 style="width: 100%; height: 100%; object-fit: cover;"
                                 onerror="this.onerror=null; this.src='https://placehold.co/400x300?text=Preview+Unavailable';" />
                        `}
                    </div>
                    <div style="padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1;">
                        <b style="font-size: 13px; word-break: break-all;">ID: ${item.id} | ${item.filename || 'Media'}</b>
                        <small style="color: #64748b; font-size: 11px;">
                            ${item.created_at ? new Date(item.created_at).toLocaleString() : ''}
                        </small>
                        <div style="margin-top: auto; padding-top: 10px;">
                            <button class="btn ghost small" onclick="deleteMediaItem(${item.id})" style="color: #ef4444; border: 1px solid #fecaca; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;">
                                Delete
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    } catch (err) {
        grid.innerHTML = `<p style="color: #ef4444;">Failed to load media: ${err.message}</p>`;
    }
}

async function handleMediaUpload(event) {
    const file = event.target.files[0];
    if (!file) return;

    if (!orgId()) {
        showToast('Please select an organization first', true);
        return;
    }

    showToast('Uploading media...');
    const formData = new FormData();
    formData.append('file', file);

    try {
        const token = localStorage.getItem('access_token') || localStorage.getItem('token');
        const res = await fetch(`/api/v1/media/upload?organization_id=${orgId()}`, {
            method: 'POST',
            headers: token ? { 'Authorization': `Bearer ${token}` } : {},
            body: formData
        });

        if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || 'Upload failed');
        }

        showToast('Media uploaded successfully! ✅');
        event.target.value = '';
        loadMediaLibrary();
    } catch (err) {
        showToast(err.message || 'Upload failed', true);
    }
}

async function deleteMediaItem(mediaId) {
    if (!confirm('Are you sure you want to delete this media?')) return;
    try {
        await api(`/media/${mediaId}`, { method: 'DELETE' });
        showToast('Media deleted successfully');
        loadMediaLibrary();
    } catch (err) {
        showToast(err.message || 'Delete failed', true);
    }
}

document.addEventListener('DOMContentLoaded', loadMediaLibrary);
</script>
{% endblock %}
