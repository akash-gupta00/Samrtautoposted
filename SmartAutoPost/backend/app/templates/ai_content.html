{% extends "base.html" %}{% block content %}<div class="split"><form class="card form-card" id="aiForm"><div class="card-title"><h2>AI Content Generator</h2><span class="pill">Powered by Gemini</span></div><label>Generation type<select id="aiType"><option value="caption">Caption</option><option value="hashtags">Hashtags</option><option value="seo">SEO Content</option><option value="image">Image Prompt</option></select></label><label>Platform<select id="aiPlatform"><option>Instagram</option><option>Facebook</option><option>LinkedIn</option><option>Threads</option></select></label><label>Prompt<textarea id="aiPrompt" rows="8" placeholder="Describe the content you want..."></textarea></label><button class="btn primary full">✦ Generate Content</button></form><div class="card"><div class="card-title"><h2>Generated Result</h2><button class="btn small" onclick="copyAI()">Copy</button></div><div id="aiResult" class="result-large">Your AI generated content will appear here.</div></div></div>{% endblock %}
