{% extends "base.html" %}{% block content %}
<div class="page-hero"><div><p class="eyebrow">SmartAutoPost</p><h2>Payments</h2><p>Create manual test payments and review transactions.</p></div><button class="btn primary" type="button" onclick="openModal('paymentModal')">+ New payment</button></div>
<div class="card"><div class="card-title"><h2>Payment Records</h2></div><div id="paymentsTable" class="table-wrap"><div class="loading">Loading payments…</div></div></div>
<div id="paymentModal" class="modal"><div class="modal-card"><button class="close" onclick="closeModal('paymentModal')">×</button><h2>Create payment</h2><form id="paymentForm"><label>Subscription ID<input id="paymentSubscription" type="number" min="1" required></label><div class="two-col"><label>Amount<input id="paymentAmount" type="number" min="0.01" step="0.01" required></label><label>Currency<input id="paymentCurrency" value="INR"></label></div><div class="two-col"><label>Gateway<input id="paymentGateway" value="manual"></label><label>Status<select id="paymentStatus"><option value="success">Success</option><option value="pending">Pending</option><option value="failed">Failed</option></select></label></div><label>Transaction ID<input id="paymentTransaction"></label><button class="btn primary full">Create payment</button></form></div></div>
{% endblock %}
