{% extends "base.html" %}{% block content %}
<div class="page-hero"><div><p class="eyebrow">SmartAutoPost</p><h2>Brand Kit</h2><p>Manage reusable brand identity and publishing defaults.</p></div></div>
<div class="split"><form class="card form-card" id="brandKitForm"><h2>Brand identity</h2><label>Brand name<input id="brandName" required placeholder="SmartAutoPost"></label><div class="two-col"><label>Primary colour<input id="brandPrimary" type="color" value="#2563eb"></label><label>Secondary colour<input id="brandSecondary" type="color" value="#7c3aed"></label></div><label>Font family<input id="brandFont" value="Inter"></label><label>Logo URL<input id="brandLogo" placeholder="https://..."></label><label>Tone of voice<input id="brandTone" placeholder="Professional and friendly"></label><label>Default hashtags<input id="brandHashtags" placeholder="#marketing #automation"></label><div class="two-col"><label>Website URL<input id="brandWebsite"></label><label>Contact email<input id="brandEmail" type="email"></label></div><label>Contact phone<input id="brandPhone"></label><button class="btn primary" type="submit">Save brand kit</button></form><div class="card preview-card"><h2>Live preview</h2><div class="brand-preview"><div class="brand-preview-logo">SP</div><h3 id="brandPreviewName">Your Brand</h3><p>Consistent design across every post.</p><button class="btn primary" type="button">Primary action</button></div></div></div>
{% endblock %}
